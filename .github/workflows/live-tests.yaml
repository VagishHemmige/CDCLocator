# Runs the live tests (tests/testthat/test-live*.R) against the HIV.gov
# Locator API, only on request:
#
# - add the `live-tests` label to a pull request (remove and re-add it to run
#   again after more pushes); or
# - Actions tab -> live-tests.yaml -> Run workflow, on any branch.
#
# Run them when request building, response parsing or tidying changes.
#
# Needs the CDC_LOCATOR_CLIENT_ID and CDC_LOCATOR_CLIENT_TOKEN repository
# secrets. GitHub does not pass secrets to pull requests from forks, so this
# works only for branches in this repository. The secret values are never
# printed: the check below tests only that they are set.
# Fails if any live test fails or skips: a skip here means a test did not run.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

name: live-tests.yaml

permissions: read-all

jobs:
  live-tests:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'live-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: live-tests-${{ github.ref }}
      cancel-in-progress: true
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CDC_LOCATOR_CLIENT_ID: ${{ secrets.CDC_LOCATOR_CLIENT_ID }}
      CDC_LOCATOR_CLIENT_TOKEN: ${{ secrets.CDC_LOCATOR_CLIENT_TOKEN }}
      CDC_LOCATOR_LIVE_TESTS: "true"
      NOT_CRAN: "true"

    steps:
      - name: Check the Locator API credentials are set
        run: |
          if [ -z "$CDC_LOCATOR_CLIENT_ID" ] || [ -z "$CDC_LOCATOR_CLIENT_TOKEN" ]; then
            echo "::error::CDC_LOCATOR_CLIENT_ID or CDC_LOCATOR_CLIENT_TOKEN is not set. Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, local::.
          needs: check

      - name: Run live tests
        run: |
          res <- as.data.frame(testthat::test_local(
            filter = "live",
            reporter = "progress",
            stop_on_failure = TRUE
          ))
          # A skip at the top of a test file leaves no rows, so check both.
          if (nrow(res) == 0) {
            stop("No live tests ran: check CDC_LOCATOR_LIVE_TESTS and that the API is reachable.")
          }
          if (any(res$skipped)) {
            stop("Live tests skipped: ", paste(unique(res$test[res$skipped]), collapse = "; "))
          }
        shell: Rscript {0}
