# One-off check of how the Locator API combines services (.github/scripts/services-probe.R).
# Runs when the `services-probe` label is added to the PR that adds it. That PR is
# meant to be closed after the run, not merged.
#
# Needs the CDC_LOCATOR_CLIENT_ID and CDC_LOCATOR_CLIENT_TOKEN repository
# secrets. The script never prints them; it prints only statuses and counts.
on:
  pull_request:
    types: [labeled]

name: services-probe.yaml

permissions: read-all

jobs:
  services-probe:
    if: github.event.label.name == 'services-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CDC_LOCATOR_CLIENT_ID: ${{ secrets.CDC_LOCATOR_CLIENT_ID }}
      CDC_LOCATOR_CLIENT_TOKEN: ${{ secrets.CDC_LOCATOR_CLIENT_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install packages
        run: install.packages(c("httr2", "jsonlite"))
        shell: Rscript {0}

      - name: Count providers per services value
        run: Rscript .github/scripts/services-probe.R
