# One-off probe of the HIV.gov Locator API (.github/scripts/api-probe.R).
# Runs when the `api-probe` label is added to the PR that adds it. That PR is
# meant to be closed after the run, not merged.
#
# Needs the CDC_LOCATOR_CLIENT_ID and CDC_LOCATOR_CLIENT_TOKEN repository
# secrets. The script never prints them; results go to the job summary.
on:
  pull_request:
    types: [labeled]

name: api-probe.yaml

permissions: read-all

jobs:
  api-probe:
    if: github.event.label.name == 'api-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CDC_LOCATOR_CLIENT_ID: ${{ secrets.CDC_LOCATOR_CLIENT_ID }}
      CDC_LOCATOR_CLIENT_TOKEN: ${{ secrets.CDC_LOCATOR_CLIENT_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install packages
        run: install.packages(c("httr2", "jsonlite"))
        shell: Rscript {0}

      - name: Probe the API
        run: Rscript .github/scripts/api-probe.R
